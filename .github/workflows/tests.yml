name: GitHub Actions CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      - name: Cache Homebrew prefix
        uses: Homebrew/actions/cache-homebrew-prefix@main
        with:
          brewfile: true
          uninstall: true

      - run: script/style
        env:
          # Used by zizmor
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: script/tests
      - run: script/build
      - run: cmp bin/strap.sh _site/strap.sh

  strap_sh:
    runs-on: macos-15
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cleanup macOS
        run: sudo rm -rf /opt/homebrew /Applications/Xcode.app /Library/Developer/CommandLineTools

      - run: bin/strap.sh
        env:
          STRAP_CI: 1
          STRAP_DEBUG: 1

      - name: Rerun bin/strap.sh
        run: bin/strap.sh
        env:
          STRAP_CI: 1

      - run: brew config

      - run: brew doctor

      - name: Test various brew installations
        run: |
          brew install --build-from-source --formula libfaketime
          brew install --cask orka
          brew install --formula xz

  docker:
    needs: [style, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and test static webserver
        run: |
          docker build --tag strap:test .
          docker run --detach --name strap-test --publish 3000:3000 strap:test
          trap 'docker rm --force strap-test' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3000/up
          curl --fail http://localhost:3000/strap.sh --output /tmp/strap-download.sh
          cmp bin/strap.sh /tmp/strap-download.sh
          curl --fail http://localhost:3000/strap.sh.txt --output /tmp/strap-preview.txt
          cmp bin/strap.sh /tmp/strap-preview.txt
          curl --fail http://localhost:3000/ --output /tmp/strap-index.html
          cmp public/index.html /tmp/strap-index.html

      - name: Login to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: mikemcquaid
          password: ${{ secrets.GITHUB_TOKEN }}

      # We don't give Dependabot access to tokens.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: mikemcquaid
          password: ${{ secrets.DOCKER_TOKEN }}

      # Dependabot doesn't have access to push to the GHCR cache
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Set up Docker cache
        run: echo DOCKER_CACHE_TO="type=registry,ref=ghcr.io/mikemcquaid/strap:cache,mode=max" >> "${GITHUB_ENV}"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            mikemcquaid/strap:latest
            mikemcquaid/strap:main
            mikemcquaid/strap:master
            ghcr.io/mikemcquaid/strap:latest
            ghcr.io/mikemcquaid/strap:main
            ghcr.io/mikemcquaid/strap:master
          cache-from: type=registry,ref=ghcr.io/mikemcquaid/strap:cache
          cache-to: ${{ env.DOCKER_CACHE_TO }}
          provenance: mode=max
          sbom: true

  pages_build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [style, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - run: script/build

      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pages_build, strap_sh]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
